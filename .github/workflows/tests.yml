name: SkeAI Tests

concurrency:
  group: cpp-training-core-validation
  cancel-in-progress: true

on:
  push:
    branches: ["main", "feat/cpp-training-core"]
  pull_request:
    branches: ["main"]

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Validation run for cpp training core
      - name: Build C++ engine
        run: python -m tools.build_cpp

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Run Level 2 benchmark
        run: python -m benchmarks.benchmark_level2 --steps 20 --batch-size 16 --batch-sizes 1,4,8,16,32
