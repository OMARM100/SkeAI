name: SkeAI Tests

concurrency:
  group: cpp-training-baseline
  cancel-in-progress: true

on:
  push:
    branches: ["main", "perf/baseline-cpp-training-ci"]
  pull_request:
    branches: ["main"]

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build C++ engine
        run: python -m tools.build_cpp

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Run Level 2 baseline benchmark
        run: python -m benchmarks.benchmark_level2 --steps 20 --batch-size 16
